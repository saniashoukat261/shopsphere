<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopSphere - Admin</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="nav"></div><main><h1>Admin dashboard</h1>
<div class="tabs" id="tabs"><button data-t="dash" class="on">Dashboard</button><button data-t="prod">Products</button><button data-t="ord">Orders</button><button data-t="usr">Users</button><button data-t="cou">Coupons</button></div>
<section id="dash"></section>
<section id="prod" hidden><div class="row"><input id="pq" placeholder="Search products..."><button class="btn" id="add">+ Add product</button></div><div class="card table-wrap" id="ptable"></div><div class="pager" id="ppager"></div></section>
<section id="ord" hidden><div class="row"><a class="btn sec" href="/api/admin/export/orders.csv">⬇ Export CSV</a><select id="ostatus"><option value="">All statuses</option><option>pending</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></div><div class="card table-wrap" id="otable"></div><div class="pager" id="opager"></div></section>
<section id="usr" hidden><div class="row"><input id="uq" placeholder="Search users..."></div><div class="card table-wrap" id="utable"></div><div class="pager" id="upager"></div></section>
<section id="cou" hidden><div class="row"><input id="ccode" placeholder="Coupon code e.g. EID25" maxlength="20"><input id="cpct" type="number" min="1" max="90" placeholder="Percent off" style="max-width:150px"><button class="btn" id="cadd">Add coupon</button></div><div class="card table-wrap" id="ctable"></div></section>
</main>
<dialog id="dlg"><form id="pf"><h2 id="dt">Product</h2>
<label>Name</label><input id="pn" required maxlength="120">
<div class="cols"><div><label>Price ($)</label><input id="pp" type="number" step="0.01" min="0" required></div><div><label>Stock</label><input id="ps" type="number" min="0" step="1" required></div></div>
<label>Category</label><input id="pc" value="General">
<label>Old price ($) - shows a discount badge (optional)</label><input id="po" type="number" step="0.01" min="0"><label>More image links (one per line, optional)</label><textarea id="pg" rows="2" placeholder="https://..."></textarea><label>Description</label><textarea id="pd" rows="3" maxlength="2000"></textarea>
<label>Image (JPG/PNG/WEBP, max 2MB)</label><input id="pi" type="file" accept="image/*"><label>…or image link (https://)</label><input id="pu" type="url" placeholder="https://example.com/photo.jpg">
<div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn sec" id="cancel">Cancel</button><button class="btn">Save</button></div></form></dialog>
<script src="/app.js"></script>
<script>
const st = { prod: 1, ord: 1, usr: 1 }; let editing = null, products = [];
const STATUSES = ['pending', 'processing', 'shipped', 'delivered', 'cancelled'];
$('#tabs').onclick = e => { const t = e.target.dataset.t; if (!t) return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === e.target));
  ['dash', 'prod', 'ord', 'usr', 'cou'].forEach(s => $('#' + s).hidden = s !== t); ({ dash, prod: loadP, ord: loadO, usr: loadU, cou: loadC })[t](); };

function chart(days) {
  const map = Object.fromEntries(days.map(d => [d._id, d.total]));
  const arr = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); const k = d.toISOString().slice(0, 10); return [k.slice(5), map[k] || 0]; });
  const max = Math.max(...arr.map(a => a[1]), 1);
  return `<svg viewBox="0 0 420 190" style="width:100%">${arr.map((a, i) => { const h = a[1] / max * 130; return `<rect x="${i * 60 + 12}" y="${150 - h}" width="36" height="${h}" rx="6" fill="var(--primary)"/><text x="${i * 60 + 30}" y="170" text-anchor="middle" font-size="11" fill="var(--muted)">${a[0]}</text><text x="${i * 60 + 30}" y="${144 - h}" text-anchor="middle" font-size="10" fill="var(--text)">${a[1] ? Math.round(a[1]) : ''}</text>`; }).join('')}</svg>`;
}
async function dash() {
  const s = await api('/api/admin/stats');
  $('#dash').innerHTML = `<div class="stats">${[['Revenue', money(s.revenue)], ['Orders', s.orders], ['Products', s.products], ['Users', s.users]].map(([l, n]) => `<div class="card stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}</div>
  <div class="cols" style="margin-bottom:20px"><div class="card"><h2>Sales - last 7 days ($)</h2>${chart(s.salesByDay)}</div>
  <div class="card table-wrap"><h2>Top selling products</h2>${s.topProducts.length ? `<table><tr><th>Product</th><th>Units sold</th></tr>${s.topProducts.map(p => `<tr><td>${esc(p._id)}</td><td>${p.qty}</td></tr>`).join('')}</table>` : '<div class="empty">No sales yet</div>'}</div></div>
  <div class="cols"><div class="card table-wrap"><h2>Recent orders</h2>${s.recent.length ? `<table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>${s.recent.map(o => `<tr><td>#${o._id.slice(-6).toUpperCase()}</td><td>${esc(o.user?.name || 'Deleted')}</td><td>${money(o.total)}</td><td><span class="pill ${o.status}">${o.status}</span></td></tr>`).join('')}</table>` : '<div class="empty">No orders yet</div>'}</div>
  <div class="card table-wrap"><h2>Low stock (≤ 5)</h2>${s.lowStock.length ? `<table><tr><th>Product</th><th>Stock</th></tr>${s.lowStock.map(p => `<tr><td>${esc(p.name)}</td><td class="${p.stock ? 'stock-low' : 'stock-out'}">${p.stock}</td></tr>`).join('')}</table>` : '<div class="empty">All good</div>'}
  <h2 style="margin-top:18px">Orders by status</h2>${s.byStatus.map(b => `<span class="pill ${b._id}">${b._id}: ${b.count}</span> `).join('') || '<span class="hint">None</span>'}</div></div>`;
  countAll($('#dash'));
}
async function loadC() {
  const c = await api('/api/admin/coupons');
  $('#ctable').innerHTML = c.length ? `<table><tr><th>Code</th><th>Discount</th><th></th></tr>${c.map(x => `<tr><td><strong>${esc(x.code)}</strong></td><td>${x.percent}%</td><td><button class="btn danger sm" data-cd="${x._id}">Delete</button></td></tr>`).join('')}</table>` : '<div class="empty">No coupons</div>';
  $('#ctable').querySelectorAll('[data-cd]').forEach(b => b.onclick = async () => { try { await api('/api/admin/coupons/' + b.dataset.cd, { method: 'DELETE' }); toast('Coupon deleted'); loadC(); } catch (e) { toast(e.message, true); } });
}
$('#cadd').onclick = async () => { try { await api('/api/admin/coupons', { method: 'POST', body: { code: $('#ccode').value, percent: +$('#cpct').value } }); $('#ccode').value = ''; $('#cpct').value = ''; toast('Coupon added'); loadC(); } catch (e) { toast(e.message, true); } };
async function loadP() {
  const d = await api(`/api/products?limit=8&page=${st.prod}&q=${encodeURIComponent($('#pq').value)}&sort=newest`); products = d.items;
  $('#ptable').innerHTML = d.items.length ? `<table><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>${d.items.map(p => `<tr><td>${p.image ? `<img src="${esc(p.image)}" alt="">` : '🛍️'}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><button class="btn sec sm" data-e="${p._id}">Edit</button> <button class="btn danger sm" data-d="${p._id}">Delete</button></td></tr>`).join('')}</table>` : '<div class="empty">No products</div>';
  $('#ptable').querySelectorAll('[data-e]').forEach(b => b.onclick = () => openForm(products.find(p => p._id === b.dataset.e)));
  $('#ptable').querySelectorAll('[data-d]').forEach(b => b.onclick = async () => { if (!confirm('Delete this product?')) return; try { await api('/api/products/' + b.dataset.d, { method: 'DELETE' }); toast('Product deleted'); loadP(); } catch (e) { toast(e.message, true); } });
  pager($('#ppager'), d.page, d.pages, n => { st.prod = n; loadP(); });
}
function openForm(p) {
  editing = p; $('#dt').textContent = p ? 'Edit product' : 'Add product'; $('#pf').reset();
  if (p) { $('#pn').value = p.name; $('#pp').value = p.price; $('#ps').value = p.stock; $('#pc').value = p.category; $('#pd').value = p.description; $('#pu').value = (p.image || '').startsWith('http') ? p.image : ''; $('#po').value = p.oldPrice || ''; $('#pg').value = (p.images || []).join('\n'); }
  $('#dlg').showModal();
}
$('#add').onclick = () => openForm(null); $('#cancel').onclick = () => $('#dlg').close();
$('#pq').oninput = debounce(() => { st.prod = 1; loadP(); });
$('#pf').onsubmit = async e => {
  e.preventDefault(); const fd = new FormData();
  [['name', 'pn'], ['price', 'pp'], ['stock', 'ps'], ['category', 'pc'], ['description', 'pd'], ['imageUrl', 'pu'], ['oldPrice', 'po'], ['images', 'pg']].forEach(([k, id]) => fd.append(k, $('#' + id).value));
  if ($('#pi').files[0]) fd.append('image', $('#pi').files[0]);
  try { await api(editing ? '/api/products/' + editing._id : '/api/products', { method: editing ? 'PUT' : 'POST', body: fd }); $('#dlg').close(); toast('Product saved'); loadP(); } catch (x) { toast(x.message, true); }
};
async function loadO() {
  const d = await api(`/api/admin/orders?page=${st.ord}&status=${$('#ostatus').value}`);
  $('#otable').innerHTML = d.items.length ? `<table><tr><th>Order</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>${d.items.map(o => `<tr><td>#${o._id.slice(-6).toUpperCase()}</td><td>${fmtDate(o.createdAt)}</td><td>${esc(o.user?.name || 'Deleted')}</td><td>${o.items.reduce((s, i) => s + i.qty, 0)}</td><td>${money(o.total)}</td><td><select data-o="${o._id}">${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table>` : '<div class="empty">No orders</div>';
  $('#otable').querySelectorAll('select').forEach(s => s.onchange = async () => { try { await api(`/api/admin/orders/${s.dataset.o}/status`, { method: 'PUT', body: { status: s.value } }); toast('Status updated'); } catch (e) { toast(e.message, true); loadO(); } });
  pager($('#opager'), d.page, d.pages, n => { st.ord = n; loadO(); });
}
$('#ostatus').onchange = () => { st.ord = 1; loadO(); };
async function loadU() {
  const d = await api(`/api/admin/users?page=${st.usr}&q=${encodeURIComponent($('#uq').value)}`);
  $('#utable').innerHTML = `<table><tr><th>Name</th><th>Email</th><th>Joined</th><th>Role</th></tr>${d.items.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${fmtDate(u.createdAt)}</td><td><select data-u="${u._id}" ${u._id === me.id ? 'disabled' : ''}><option ${u.role === 'user' ? 'selected' : ''}>user</option><option ${u.role === 'admin' ? 'selected' : ''}>admin</option></select></td></tr>`).join('')}</table>`;
  $('#utable').querySelectorAll('select').forEach(s => s.onchange = async () => { try { await api(`/api/admin/users/${s.dataset.u}/role`, { method: 'PUT', body: { role: s.value } }); toast('Role updated'); } catch (e) { toast(e.message, true); loadU(); } });
  pager($('#upager'), d.page, d.pages, n => { st.usr = n; loadU(); });
}
$('#uq').oninput = debounce(() => { st.usr = 1; loadU(); });
window.onReady = () => { if (!me || me.role !== 'admin') return location.href = '/login.html'; dash().catch(e => toast(e.message, true)); };
</script></body></html>
