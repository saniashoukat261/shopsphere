<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopSphere - Create account</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="nav"></div><main><form class="card form" id="f" novalidate><h1>Create account</h1><label>Full name</label><input id="name" required minlength="2" maxlength="60">
<label>Email</label><input id="email" type="email" required autocomplete="email">
<label>Password</label><input id="password" type="password" required autocomplete="current-password"><div class="hint">Min 8 characters with uppercase, lowercase and a number.</div>
<p id="err" style="color:var(--err);min-height:1.2em"></p>
<button class="btn" style="width:100%">Register</button><p class="hint" style="text-align:center">Have an account? <a href="/login.html">Login</a></p></form></main>
<script src="/app.js"></script><script>
$('#f').onsubmit = async e => {
  e.preventDefault(); $('#err').textContent = '';
  const em = $('#email').value;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) return $('#err').textContent = 'Enter a valid email';
  if ('register' === 'register' && !/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,64}$/.test($('#password').value)) return $('#err').textContent = 'Password must be 8+ characters with uppercase, lowercase and a number';
  try { await api('/api/auth/register', { method: 'POST', body: {name:$('#name').value,email:$('#email').value,password:$('#password').value} }); location.href = '/'; } catch (x) { $('#err').textContent = x.message; }
};
</script></body></html>
